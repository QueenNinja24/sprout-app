<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sprout Tracker</title>
    <style>
        :root {
            --bg: #FFF0F5;
            --card: #FFFFFF;
            --text: #333333;
            --primary: #FFB6C1;
            --primary-dark: #FF69B4;
            --success: #90EE90;
            --danger: #FFB6C1;
            --gray: #E0E0E0;
            --rest: #B0C4DE;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg); margin: 0; padding: 20px; color: var(--text); padding-bottom: 80px; }
        .container { max-width: 500px; margin: 0 auto; }
        
        /* Sprout Stage */
        .stage { background: var(--card); border-radius: 24px; padding: 30px 20px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 15px; position: relative; }
        #sprout-container { transition: transform 0.3s ease; }
        .bounce { animation: bounce 2s infinite ease-in-out; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .sad { animation: none; filter: grayscale(40%); }
        
        /* Stats */
        .stats-row { display: flex; justify-content: space-around; margin-top: 15px; font-weight: bold; }
        .stat-pill { background: var(--bg); padding: 8px 16px; border-radius: 20px; font-size: 14px; }
        
        /* Goal Section */
        .goal-card { background: var(--card); border-radius: 16px; padding: 15px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.03); text-align: center; }
        .goal-label { font-size: 12px; color: #888; text-transform: uppercase; font-weight: bold; margin-bottom: 5px; }
        #user-goal { font-size: 16px; font-weight: bold; outline: none; border-bottom: 1px dashed var(--gray); padding-bottom: 5px; color: var(--primary-dark); transition: 0.2s; margin-bottom: 15px; }
        #user-goal:focus { border-bottom-color: var(--primary-dark); }
        
        /* Weight Tracker HUD */
        .weight-hud { display: flex; justify-content: space-between; gap: 10px; }
        .weight-box { flex: 1; background: var(--bg); padding: 10px; border-radius: 12px; }
        .weight-box.highlight { background: var(--success); color: #006400; }
        .weight-box-title { font-size: 10px; font-weight: bold; color: #888; margin-bottom: 4px; text-transform: uppercase; }
        .highlight .weight-box-title { color: #006400; opacity: 0.8; }
        .weight-val { font-size: 18px; font-weight: bold; }
        .weight-input-small { width: 100%; border: none; background: transparent; font-size: 18px; font-weight: bold; text-align: center; color: var(--text); outline: none; border-bottom: 1px dashed #ccc; }

        /* Calendar */
        .calendar-strip { display: flex; justify-content: space-between; overflow-x: auto; padding: 10px 0; margin-bottom: 20px; gap: 8px; }
        .cal-day { background: var(--card); padding: 10px 5px; border-radius: 12px; min-width: 45px; text-align: center; cursor: pointer; border: 2px solid transparent; transition: 0.2s; }
        .cal-day.active { border-color: var(--primary-dark); background: var(--bg); }
        .cal-day.missed { opacity: 0.6; }
        .cal-day .day-name { font-size: 12px; color: #888; }
        .cal-day .day-num { font-weight: bold; margin: 4px 0; }
        .cal-day .indicator { width: 8px; height: 8px; border-radius: 50%; margin: 0 auto; background: var(--gray); }
        .indicator.success { background: var(--success); }
        .indicator.fail { background: #FF6B6B; }
        .indicator.rest { background: var(--rest); }

        /* Actions */
        .card { background: var(--card); border-radius: 16px; padding: 20px; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.03); }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .card-header h3 { margin: 0; font-size: 18px; }
        
        .editing-badge { background: #FFE4B5; color: #B8860B; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; cursor: pointer; display: none; }
        
        .toggle-btn { width: 100%; padding: 15px; border-radius: 12px; border: none; font-size: 16px; font-weight: bold; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: 0.2s; background: var(--gray); color: #555; margin-bottom: 10px;}
        .toggle-btn.checked { background: var(--success); color: #006400; }
        .toggle-btn.rest-checked { background: var(--rest); color: #104E8B; }
        
        .meal-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        .meal-name { font-weight: 500; width: 80px; }
        .meal-opts { display: flex; gap: 8px; }
        .meal-opt { padding: 8px 16px; border-radius: 8px; border: 1px solid var(--gray); background: white; cursor: pointer; transition: 0.2s; }
        .meal-opt.h-active { background: var(--success); border-color: var(--success); color: darkgreen; font-weight: bold; }
        .meal-opt.u-active { background: #FF6B6B; border-color: #FF6B6B; color: white; font-weight: bold; }
        .meal-opt.o-active { background: #FFFACD; border-color: #DAA520; color: #8B8B00; font-weight: bold; }
        
        .daily-weight-input { width: 100%; padding: 15px; border-radius: 12px; border: 2px solid var(--gray); font-size: 16px; text-align: center; outline: none; transition: 0.2s; margin-bottom: 15px; }
        .daily-weight-input:focus { border-color: var(--primary-dark); }

        .reset-btn { width: 100%; padding: 15px; background: transparent; border: 2px dashed #FF6B6B; color: #FF6B6B; border-radius: 12px; cursor: pointer; font-weight: bold; margin-top: 30px; }
        
        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 12px 24px; border-radius: 20px; opacity: 0; transition: 0.3s; pointer-events: none; z-index: 100; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="stage">
        <h2 id="sprout-message" style="margin-top:0; margin-bottom: 20px; font-size: 20px;">Let's grow today!</h2>
        
        <div id="sprout-container" class="bounce">
            <svg id="sprout-svg" width="160" height="160" viewBox="0 0 100 100">
                <circle id="sprout-body" cx="50" cy="65" r="30" fill="#FFB6C1" />
                <path id="sprout-leaf" d="M50 35 Q65 10 80 25 Q60 40 50 35" fill="#32CD32" />
                <circle class="eye" cx="40" cy="60" r="3" fill="#333" />
                <circle class="eye" cx="60" cy="60" r="3" fill="#333" />
                <path id="sprout-mouth" d="M 45 70 Q 50 75 55 70" stroke="#333" stroke-width="2" fill="transparent" stroke-linecap="round"/>
                <circle cx="32" cy="65" r="4" fill="#FF69B4" opacity="0.5" />
                <circle cx="68" cy="65" r="4" fill="#FF69B4" opacity="0.5" />
                
                <g id="acc-bandana" style="display:none;">
                    <path d="M 20 50 Q 50 70 80 50 L 85 45 Q 50 60 15 45 Z" fill="#FF4500" />
                    <path d="M 20 50 L 10 70 L 25 55 Z" fill="#FF4500" />
                </g>
                <g id="acc-glasses" style="display:none;">
                    <rect x="33" y="55" width="14" height="8" rx="2" fill="#222" />
                    <rect x="53" y="55" width="14" height="8" rx="2" fill="#222" />
                    <line x1="47" y1="59" x2="53" y2="59" stroke="#222" stroke-width="2" />
                </g>
                <g id="acc-crown" style="display:none;">
                    <path d="M 35 35 L 40 20 L 50 30 L 60 20 L 65 35 Z" fill="#FFD700" stroke="#DAA520" stroke-width="1"/>
                </g>
                <text id="sleep-zzz" x="70" y="30" fill="#104E8B" font-size="14" font-weight="bold" style="display:none; animation: bounce 2s infinite;">Zzz</text>
            </svg>
        </div>

        <div class="stats-row">
            <div class="stat-pill">🔥 Streak: <span id="streak-count">0</span></div>
            <div class="stat-pill">⭐ Best: <span id="best-count">0</span></div>
        </div>
    </div>

    <!-- Goal Section -->
    <div class="goal-card">
        <div class="goal-label">Current Goal</div>
        <div id="user-goal" contenteditable="true" onblur="saveGoal()">Tap to set your goal...</div>
        
        <div class="weight-hud">
            <div class="weight-box">
                <div class="weight-box-title">Start Weight</div>
                <input type="number" id="start-weight-input" class="weight-input-small" onblur="saveStartWeight()" placeholder="0.0">
            </div>
            <div class="weight-box">
                <div class="weight-box-title">Target Weight</div>
                <input type="number" id="target-weight-input" class="weight-input-small" onblur="saveTargetWeight()" placeholder="0.0">
            </div>
            <div class="weight-box highlight">
                <div class="weight-box-title">To Go!</div>
                <div class="weight-val" id="weight-to-go-display">--</div>
            </div>
        </div>

        <div style="margin-top: 15px; background: var(--bg); padding: 12px; border-radius: 12px; text-align: left;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
                <div class="weight-box-title" style="margin: 0;">Target Timeframe</div>
                <input type="date" id="target-date-input" style="border:none; background:transparent; font-size:12px; font-weight:bold; color:var(--text); outline:none; font-family:inherit;" onblur="saveTargetDate()">
            </div>
            <div id="days-remaining" style="font-size: 12px; font-weight: bold; color: var(--primary-dark); margin-bottom: 12px;"></div>
            
            <div style="display:flex; justify-content:space-between; font-size: 10px; color: #888; margin-bottom: 4px; font-weight: bold; text-transform: uppercase;">
                <span>Progress</span>
                <span id="progress-percent">0%</span>
            </div>
            <div style="width: 100%; background: #D3D3D3; height: 8px; border-radius: 4px; overflow: hidden;">
                <div id="progress-bar" style="width: 0%; background: var(--success); height: 100%; transition: 0.5s;"></div>
            </div>
        </div>

        <div id="weight-graph" style="margin-top: 15px; padding-top: 10px; border-top: 1px dashed var(--gray);"></div>
    </div>

    <!-- Calendar -->
    <div class="calendar-strip" id="calendar-container"></div>

    <!-- Actions Area -->
    <div class="card">
        <div class="card-header">
            <h3 id="action-date-title">Today's Log</h3>
            <div id="back-to-today" class="editing-badge" onclick="setEditingDate(getTodayString())">Back to Today ↩</div>
        </div>

        <button id="btn-workout" class="toggle-btn" onclick="toggleWorkout()">
            <span>🏋️ Hit the Gym</span>
            <span id="check-workout">⚪</span>
        </button>
        
        <button id="btn-rest" class="toggle-btn" onclick="toggleRest()">
            <span>💤 Rest Day</span>
            <span id="check-rest">⚪</span>
        </button>

        <hr style="border: 0; border-top: 1px solid #EEE; margin: 20px 0;">

        <div id="meal-section">
            <h3 style="margin-top: 0; font-size: 16px; margin-bottom: 15px;">Meals</h3>
            <div class="meal-row">
                <div class="meal-name">Breakfast</div>
                <div class="meal-opts">
                    <div id="m-b-h" class="meal-opt" onclick="setMeal('b', 'h')">🥗 Good</div>
                    <div id="m-b-u" class="meal-opt" onclick="setMeal('b', 'u')">🍕 Bad</div>
                </div>
            </div>
            <div class="meal-row">
                <div class="meal-name">Lunch</div>
                <div class="meal-opts">
                    <div id="m-l-h" class="meal-opt" onclick="setMeal('l', 'h')">🥗 Good</div>
                    <div id="m-l-u" class="meal-opt" onclick="setMeal('l', 'u')">🍕 Bad</div>
                </div>
            </div>
            <div class="meal-row">
                <div class="meal-name">Dinner</div>
                <div class="meal-opts">
                    <div id="m-d-h" class="meal-opt" onclick="setMeal('d', 'h')">🥗 Good</div>
                    <div id="m-d-u" class="meal-opt" onclick="setMeal('d', 'u')">🍕 Bad</div>
                </div>
            </div>
        </div>

        <hr style="border: 0; border-top: 1px solid #EEE; margin: 20px 0;">

        <div id="mood-section">
            <h3 style="margin-top: 0; font-size: 16px; margin-bottom: 15px;">Mood</h3>
            <div class="meal-opts" style="margin-bottom: 20px;">
                <div id="mood-great" class="meal-opt" onclick="setMood('great')">🤩 Great</div>
                <div id="mood-okay" class="meal-opt" onclick="setMood('okay')">😐 Okay</div>
                <div id="mood-bad" class="meal-opt" onclick="setMood('bad')">😫 Bad</div>
            </div>
        </div>
        
        <hr style="border: 0; border-top: 1px solid #EEE; margin: 20px 0;">
        
        <div>
            <h3 style="margin-top: 0; font-size: 16px; margin-bottom: 15px;">Daily Scale</h3>
            <input type="number" id="daily-weight-input" class="daily-weight-input" onblur="saveDailyWeight()" placeholder="Enter your weight for this day...">
        </div>
    </div>

    <button class="reset-btn" onclick="resetApp()">⚠️ Hard Reset Data</button>
</div>

<div id="toast" class="toast">Saved!</div>

<script>
    // --- UTILS ---
    function getTodayString() {
        const d = new Date();
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }
    
    function getOffsetDateString(offsetDays) {
        const d = new Date();
        d.setDate(d.getDate() + offsetDays);
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.innerText = msg;
        t.style.opacity = 1;
        setTimeout(() => t.style.opacity = 0, 2000);
    }

    // --- STATE MANAGEMENT & MIGRATION ---
    let data = JSON.parse(localStorage.getItem('sproutData')) || { logs: {}, bestStreak: 0, goal: "Tap to set your goal...", targetWeight: "", startingWeight: "", targetDate: "" };
    let editingDate = getTodayString();

    if (data.targetWeight === undefined) data.targetWeight = "";
    if (data.startingWeight === undefined) data.startingWeight = "";
    if (data.targetDate === undefined) data.targetDate = "";

    document.getElementById('user-goal').innerText = data.goal || "Tap to set your goal...";
    document.getElementById('start-weight-input').value = data.startingWeight;
    document.getElementById('target-weight-input').value = data.targetWeight;
    document.getElementById('target-date-input').value = data.targetDate;

    function saveGoal() { data.goal = document.getElementById('user-goal').innerText; saveData(); showToast("Goal Saved! 🎯"); }
    function saveStartWeight() { data.startingWeight = document.getElementById('start-weight-input').value; saveData(); showToast("Start Saved! ⚖️"); }
    function saveTargetWeight() { data.targetWeight = document.getElementById('target-weight-input').value; saveData(); showToast("Target Saved! 🎯"); }
    function saveTargetDate() { data.targetDate = document.getElementById('target-date-input').value; saveData(); showToast("Date Saved! 📅"); }
    
    function saveDailyWeight() {
        initDay(editingDate);
        data.logs[editingDate].weight = document.getElementById('daily-weight-input').value;
        saveData();
        showToast("Weight Logged! ⚖️");
    }

    function initDay(dateStr) {
        if (!data.logs[dateStr]) {
            data.logs[dateStr] = { workout: false, restDay: false, meals: { b: null, l: null, d: null }, weight: "", mood: null };
        } else {
            if (data.logs[dateStr].weight === undefined) data.logs[dateStr].weight = "";
            if (data.logs[dateStr].mood === undefined) data.logs[dateStr].mood = null;
        }
    }

    function saveData() {
        localStorage.setItem('sproutData', JSON.stringify(data));
        calculateEngine();
        render();
    }

    // --- ACTIONS ---
    function toggleWorkout() {
        initDay(editingDate);
        if (data.logs[editingDate].restDay) data.logs[editingDate].restDay = false;
        data.logs[editingDate].workout = !data.logs[editingDate].workout;
        if(data.logs[editingDate].workout) showToast("+ Workout Logged!");
        saveData();
    }

    function toggleRest() {
        initDay(editingDate);
        data.logs[editingDate].restDay = !data.logs[editingDate].restDay;
        if(data.logs[editingDate].restDay) {
            data.logs[editingDate].workout = false; 
            data.logs[editingDate].meals = { b: null, l: null, d: null }; 
            showToast("Rest Day Active 💤");
        }
        saveData();
    }

    function setMeal(mealType, healthType) {
        initDay(editingDate);
        if (data.logs[editingDate].restDay) return; 
        if (data.logs[editingDate].meals[mealType] === healthType) {
            data.logs[editingDate].meals[mealType] = null;
        } else {
            data.logs[editingDate].meals[mealType] = healthType;
        }
        saveData();
    }

    function setMood(moodType) {
        initDay(editingDate);
        if (data.logs[editingDate].restDay) return;
        if (data.logs[editingDate].mood === moodType) {
            data.logs[editingDate].mood = null;
        } else {
            data.logs[editingDate].mood = moodType;
        }
        saveData();
        showToast("Mood logged! 🎭");
    }

    function setEditingDate(dateStr) {
        editingDate = dateStr;
        render();
    }

    function resetApp() {
        if(confirm("Are you sure? This deletes all history and resets Sprout to baby size.")) {
            localStorage.removeItem('sproutData');
            data = { logs: {}, bestStreak: 0, goal: "Tap to set your goal...", targetWeight: "", startingWeight: "", targetDate: "" };
            editingDate = getTodayString();
            document.getElementById('user-goal').innerText = data.goal;
            document.getElementById('start-weight-input').value = data.startingWeight;
            document.getElementById('target-weight-input').value = data.targetWeight;
            document.getElementById('target-date-input').value = data.targetDate;
            saveData();
        }
    }

    // --- ENGINE ---
    let currentStreak = 0;
    let isSick = false;
    let latestWeighIn = null;

    function calculateEngine() {
        currentStreak = 0;
        isSick = false;
        latestWeighIn = null;
        let breakFound = false;
        
        for (let i = 0; i < 60; i++) {
            let dStr = getOffsetDateString(-i);
            let log = data.logs[dStr];
            
            if (latestWeighIn === null && log && log.weight && log.weight !== "") {
                latestWeighIn = parseFloat(log.weight);
            }

            if (i < 30) {
                if (i === 0 && (!log || (!log.workout && !log.restDay && !log.meals.b && !log.meals.l && !log.meals.d))) {
                    continue; 
                }
                if (!log) {
                    breakFound = true;
                    if (i === 1) isSick = true;
                    continue;
                }
                if (log.restDay) continue;

                let score = 0;
                if (log.workout) score += 2;
                ['b', 'l', 'd'].forEach(m => {
                    if (log.meals[m] === 'h') score += 1;
                    if (log.meals[m] === 'u') score -= 1;
                });

                if (score > 0) {
                    if (!breakFound) currentStreak++;
                } else if (score < 0) {
                    breakFound = true;
                    if (i <= 1) isSick = true;
                } else {
                    breakFound = true;
                }
            }
        }
        if (currentStreak > data.bestStreak) data.bestStreak = currentStreak;
    }

    // --- RENDER UI ---
    function render() {
        initDay(editingDate);
        const log = data.logs[editingDate];
        const isToday = editingDate === getTodayString();

        document.getElementById('action-date-title').innerText = isToday ? "Today's Log" : "Editing: " + editingDate;
        document.getElementById('back-to-today').style.display = isToday ? 'none' : 'block';
        
        const wBtn = document.getElementById('btn-workout');
        const rBtn = document.getElementById('btn-rest');
        const mealSec = document.getElementById('meal-section');

        if (log.workout) { wBtn.className = 'toggle-btn checked'; document.getElementById('check-workout').innerText = '✅'; } 
        else { wBtn.className = 'toggle-btn'; document.getElementById('check-workout').innerText = '⚪'; }

        if (log.restDay) {
            rBtn.className = 'toggle-btn rest-checked'; document.getElementById('check-rest').innerText = '✅';
            wBtn.style.opacity = '0.5'; mealSec.style.opacity = '0.3'; mealSec.style.pointerEvents = 'none';
        } else {
            rBtn.className = 'toggle-btn'; document.getElementById('check-rest').innerText = '⚪';
            wBtn.style.opacity = '1'; mealSec.style.opacity = '1'; mealSec.style.pointerEvents = 'auto';
        }

        ['b', 'l', 'd'].forEach(m => {
            document.getElementById(`m-${m}-h`).className = `meal-opt ${log.meals[m] === 'h' ? 'h-active' : ''}`;
            document.getElementById(`m-${m}-u`).className = `meal-opt ${log.meals[m] === 'u' ? 'u-active' : ''}`;
        });

        let mBtnG = document.getElementById('mood-great');
        let mBtnO = document.getElementById('mood-okay');
        let mBtnB = document.getElementById('mood-bad');
        mBtnG.className = `meal-opt ${log.mood === 'great' ? 'h-active' : ''}`;
        mBtnO.className = `meal-opt ${log.mood === 'okay' ? 'o-active' : ''}`;
        mBtnB.className = `meal-opt ${log.mood === 'bad' ? 'u-active' : ''}`;

        document.getElementById('daily-weight-input').value = log.weight || "";
        
        // Progress Calcs
        let start = parseFloat(data.startingWeight);
        let target = parseFloat(data.targetWeight);
        let toGoDisplay = document.getElementById('weight-to-go-display');
        let pBar = document.getElementById('progress-bar');
        let pText = document.getElementById('progress-percent');
        
        if (!isNaN(target) && latestWeighIn !== null) {
            toGoDisplay.innerText = Math.abs(latestWeighIn - target).toFixed(1);
        } else {
            toGoDisplay.innerText = "--";
        }

        if (!isNaN(start) && !isNaN(target) && latestWeighIn !== null && start !== target) {
            let totalToLose = Math.abs(start - target);
            let lostSoFar = Math.abs(start - latestWeighIn);
            let pct = Math.max(0, Math.min(100, (lostSoFar / totalToLose) * 100));
            pBar.style.width = pct + '%';
            pText.innerText = Math.round(pct) + '%';
        } else {
            pBar.style.width = '0%';
            pText.innerText = '0%';
        }

        // Timeframe Calcs
        let daysRemDiv = document.getElementById('days-remaining');
        if (data.targetDate) {
            let tDate = new Date(data.targetDate);
            let today = new Date();
            let diffTime = tDate - today;
            let diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            if (diffDays > 0) daysRemDiv.innerText = `⏳ ${diffDays} days remaining to hit your target!`;
            else if (diffDays === 0) daysRemDiv.innerText = `⏳ Target date is today!`;
            else daysRemDiv.innerText = `⏰ Target date passed by ${Math.abs(diffDays)} days.`;
        } else {
            daysRemDiv.innerText = `Tap to set a target date ☝️`;
        }

        document.getElementById('streak-count').innerText = currentStreak;
        document.getElementById('best-count').innerText = data.bestStreak;
        renderCalendar();
        renderGraph();
        updateSproutVisuals();
    }

    function renderGraph() {
        const graphCont = document.getElementById('weight-graph');
        let points = [];
        for(let date in data.logs) {
            if(data.logs[date].weight) {
                points.push({date: new Date(date).getTime(), val: parseFloat(data.logs[date].weight)});
            }
        }
        points.sort((a,b) => a.date - b.date);
        
        if(points.length < 2) {
            graphCont.innerHTML = '<div style="padding:20px; text-align:center; color:#888; font-size:12px; font-weight:bold;">Log your weight for at least 2 days to see your trend graph! 📈</div>';
            return;
        }

        let minVal = Math.min(...points.map(p => p.val));
        let maxVal = Math.max(...points.map(p => p.val));
        let target = parseFloat(data.targetWeight);
        if(!isNaN(target)) {
            minVal = Math.min(minVal, target);
            maxVal = Math.max(maxVal, target);
        }
        
        let range = maxVal - minVal;
        if(range === 0) range = 10;
        minVal -= range * 0.1;
        maxVal += range * 0.1;

        let minTime = points[0].date;
        let maxTime = points[points.length-1].date;
        let timeRange = maxTime - minTime;
        if(timeRange === 0) timeRange = 1;

        let polyPoints = points.map(p => {
            let x = ((p.date - minTime) / timeRange) * 100;
            let y = 100 - (((p.val - minVal) / (maxVal - minVal)) * 100);
            return `${x},${y}`;
        }).join(' ');

        let targetLine = '';
        if(!isNaN(target)) {
            let ty = 100 - (((target - minVal) / (maxVal - minVal)) * 100);
            targetLine = `<line x1="0" y1="${ty}" x2="100" y2="${ty}" stroke="#FFB6C1" stroke-width="1.5" stroke-dasharray="4" />`;
        }

        graphCont.innerHTML = `
            <div style="font-size: 10px; font-weight: bold; color: #888; text-transform: uppercase; margin-bottom: 5px;">Progress Graph</div>
            <svg viewBox="0 0 100 100" style="width:100%; height:120px; overflow:visible;">
                ${targetLine}
                <polyline fill="none" stroke="#FF69B4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" points="${polyPoints}" />
                ${points.map(p => {
                    let x = ((p.date - minTime) / timeRange) * 100;
                    let y = 100 - (((p.val - minVal) / (maxVal - minVal)) * 100);
                    return `<circle cx="${x}" cy="${y}" r="2" fill="#FF69B4" />`;
                }).join('')}
            </svg>
        `;
    }

    function renderCalendar() {
        const cal = document.getElementById('calendar-container');
        cal.innerHTML = '';
        const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

        for (let i = 6; i >= 0; i--) {
            let d = new Date();
            d.setDate(d.getDate() - i);
            let dStr = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
            let dayLog = data.logs[dStr];

            let statusClass = 'missed';
            if (dayLog) {
                if (dayLog.restDay) statusClass = 'rest';
                else {
                    let score = (dayLog.workout ? 2 : 0) + 
                                (dayLog.meals.b==='h'?1 : dayLog.meals.b==='u'?-1:0) + 
                                (dayLog.meals.l==='h'?1 : dayLog.meals.l==='u'?-1:0) + 
                                (dayLog.meals.d==='h'?1 : dayLog.meals.d==='u'?-1:0);
                    if (score > 0) statusClass = 'success';
                    if (score < 0) statusClass = 'fail';
                }
            }
            if (i === 0 && !dayLog) statusClass = 'missed'; 

            let div = document.createElement('div');
            div.className = `cal-day ${dStr === editingDate ? 'active' : ''}`;
            div.onclick = () => setEditingDate(dStr);
            div.innerHTML = `
                <div class="day-name">${days[d.getDay()]}</div>
                <div class="day-num">${d.getDate()}</div>
                <div class="indicator ${statusClass}"></div>
            `;
            cal.appendChild(div);
        }
    }

    function updateSproutVisuals() {
        const msg = document.getElementById('sprout-message');
        const body = document.getElementById('sprout-body');
        const mouth = document.getElementById('sprout-mouth');
        const cont = document.getElementById('sprout-container');
        const zzz = document.getElementById('sleep-zzz');
        
        let newRadius = 30 + (currentStreak * 2);
        if (newRadius > 48) newRadius = 48;
        body.setAttribute('r', newRadius);

        let todayLog = data.logs[getTodayString()];
        
        if (todayLog && todayLog.restDay) {
            msg.innerText = "Shhh... Recharging! 💤";
            cont.className = ''; 
            mouth.setAttribute('d', 'M 45 68 Q 50 68 55 68'); 
            zzz.style.display = 'block';
            document.querySelectorAll('.eye').forEach(e => e.setAttribute('d', 'M40 60 L45 60'));
        } else if (isSick) {
            msg.innerText = "I feel weak... save me! 🤒";
            cont.className = 'sad';
            mouth.setAttribute('d', 'M 45 75 Q 50 70 55 75'); 
            zzz.style.display = 'none';
        } else if (currentStreak > 0) {
            msg.innerText = `Streak of ${currentStreak}! I'm growing! 🔥`;
            cont.className = 'bounce';
            mouth.setAttribute('d', 'M 45 70 Q 50 78 55 70'); 
            zzz.style.display = 'none';
        } else {
            msg.innerText = "Let's build a streak! 🌱";
            cont.className = 'bounce';
            mouth.setAttribute('d', 'M 45 70 Q 50 75 55 70'); 
            zzz.style.display = 'none';
        }

        document.getElementById('acc-bandana').style.display = currentStreak >= 5 ? 'block' : 'none';
        document.getElementById('acc-glasses').style.display = currentStreak >= 10 ? 'block' : 'none';
        document.getElementById('acc-crown').style.display = currentStreak >= 15 ? 'block' : 'none';
    }

    // --- INIT ---
    calculateEngine();
    render();
</script>
